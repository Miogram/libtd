name: libtd-ci

on:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checking new tdlib/td version
      id: check_version
      run: |
        COMMITS=$(curl -s "https://api.github.com/repos/tdlib/td/commits?per_page=10")
        VERSION_COMMIT=$(echo "$COMMITS" | jq -r '.[] | select(.commit.message | startswith("Update version to ")) | .commit.message' | head -n 1)
        if [ -z "$VERSION_COMMIT" ]; then
          echo "No version update found in last 10 commits"
          echo "should_build=false" >> $GITHUB_OUTPUT
          exit 0
        fi
        echo "Found version commit: $VERSION_COMMIT"
        VERSION=$(echo "$VERSION_COMMIT" | grep -oP '(?<=Update version to )[0-9]+\.[0-9]+\.[0-9]+')
        COMMIT_SHA=$(echo "$COMMITS" | jq -r '.[] | select(.commit.message | startswith("Update version to ")) | .sha' | head -n 1)
        COMMIT_DATE=$(echo "$COMMITS" | jq -r '.[] | select(.commit.message | startswith("Update version to ")) | .commit.author.date' | head -n 1)
        COMMIT_TIMESTAMP=$(date -d "$COMMIT_DATE" +%s)
        CURRENT_TIMESTAMP=$(date +%s)
        HOURS_AGO=$(( ($CURRENT_TIMESTAMP - $COMMIT_TIMESTAMP) / 3600 ))
        if [ $HOURS_AGO -gt 24 ]; then
          echo "Version commit is older than 24 hours, skipping"
          echo "should_build=false" >> $GITHUB_OUTPUT
          exit 0
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
        echo "should_build=true" >> $GITHUB_OUTPUT

    - name: Checking out libtd repo
      if: steps.check_version.outputs.should_build == 'true'
      uses: actions/checkout@v6
      with:
        repository: Miogram/libtd
        token: ${{ secrets.PAT_TOKEN }}

    - name: Checking if version already built
      if: steps.check_version.outputs.should_build == 'true'
      id: check_existing
      run: |
        VERSION="${{ steps.check_version.outputs.version }}"
        if git tag | grep -q "^v$VERSION$"; then
          echo "Version $VERSION already built"
          echo "skip_build=true" >> $GITHUB_OUTPUT
        else
          echo "Version $VERSION not found, proceeding with build"
          echo "skip_build=false" >> $GITHUB_OUTPUT
        fi

    - name: Cloning tdlib/td repo
      if: steps.check_version.outputs.should_build == 'true' && steps.check_existing.outputs.skip_build == 'false'
      run: |
        git clone https://github.com/tdlib/td.git td
        cd td
        git checkout ${{ steps.check_version.outputs.commit_sha }}

    - name: Setting up JDK 17
      if: steps.check_version.outputs.should_build == 'true' && steps.check_existing.outputs.skip_build == 'false'
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Caching Android SDK
      if: steps.check_version.outputs.should_build == 'true' && steps.check_existing.outputs.skip_build == 'false'
      uses: actions/cache@v5
      with:
        path: td/example/android/android-sdk
        key: android-sdk-${{ runner.os }}

    - name: Caching OpenSSL
      if: steps.check_version.outputs.should_build == 'true' && steps.check_existing.outputs.skip_build == 'false'
      uses: actions/cache@v5
      with:
        path: td/example/android/third_party/openssl
        key: openssl-${{ runner.os }}-${{ hashFiles('td/example/android/build-openssl.sh') }}

    - name: Caching NDK
      if: steps.check_version.outputs.should_build == 'true' && steps.check_existing.outputs.skip_build == 'false'
      uses: actions/cache@v5
      with:
        path: td/example/android/android-ndk
        key: android-ndk-${{ runner.os }}

    - name: Installing deps
      if: steps.check_version.outputs.should_build == 'true' && steps.check_existing.outputs.skip_build == 'false'
      run: |
        sudo apt-get update
        sudo apt-get install -y gperf make perl php sed tar unzip

    - name: Run environment checking
      if: steps.check_version.outputs.should_build == 'true' && steps.check_existing.outputs.skip_build == 'false'
      run: |
        cd td/example/android
        ./check-environment.sh

    - name: Fetching Android SDK
      if: steps.check_version.outputs.should_build == 'true' && steps.check_existing.outputs.skip_build == 'false'
      run: |
        cd td/example/android
        ./fetch-sdk.sh

    - name: Building OpenSSL
      if: steps.check_version.outputs.should_build == 'true' && steps.check_existing.outputs.skip_build == 'false'
      run: |
        cd td/example/android
        ./build-openssl.sh

    - name: Building tdlib
      if: steps.check_version.outputs.should_build == 'true' && steps.check_existing.outputs.skip_build == 'false'
      run: |
        cd td/example/android
        ./build-tdlib.sh

    - name: Preparing directory structure
      if: steps.check_version.outputs.should_build == 'true' && steps.check_existing.outputs.skip_build == 'false'
      run: |
        mkdir -p src/main/java
        mkdir -p src/main/libs
        cp -r td/example/android/tdlib/java/* src/main/java/
        cp -r td/example/android/tdlib/libs/* src/main/libs/
        rm -rf td

    - name: Configuring Git
      if: steps.check_version.outputs.should_build == 'true' && steps.check_existing.outputs.skip_build == 'false'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Committing and pushing changes
      if: steps.check_version.outputs.should_build == 'true' && steps.check_existing.outputs.skip_build == 'false'
      run: |
        VERSION="${{ steps.check_version.outputs.version }}"
        git add src/
        git commit -m "Update TDLib to version $VERSION" || echo "No changes to commit"
        git tag "v$VERSION"
        git push origin master
        git push origin "v$VERSION"
      env:
        GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

    - name: Creating release
      if: steps.check_version.outputs.should_build == 'true' && steps.check_existing.outputs.skip_build == 'false'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.check_version.outputs.version }}
        name: libtd v${{ steps.check_version.outputs.version }}
        body: |
          Automated libtd ${{ steps.check_version.outputs.version }} build
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}

