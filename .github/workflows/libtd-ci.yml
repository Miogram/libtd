name: libtd-ci

on:
  schedule:
    - cron: '17 3,15 * * *'
  workflow_dispatch:
    inputs:
      build_target:
        description: 'TDLib build target'
        type: choice
        default: latest-release
        options:
          - latest-release
          - latest-commit

permissions:
  contents: read

concurrency:
  group: libtd-publisher-${{ github.repository }}
  cancel-in-progress: false

env:
  PATCHES_REPOSITORY: Miogram/patches
  PATCHES_REF: 680f6c05b44738d09b6ff7653edd1fdb7d052d11
  ANDROID_NDK_VERSION: 23.2.8568313
  OPENSSL_VERSION: OpenSSL_1_1_1w
  ANDROID_PLATFORM: android-27
  BUILD_TARGET: ${{ inputs.build_target || 'latest-release' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      version: ${{ steps.upstream.outputs.version }}
      sha: ${{ steps.upstream.outputs.sha }}
      should_build: ${{ steps.upstream.outputs.should_build }}
      prerelease: ${{ steps.upstream.outputs.prerelease }}

    steps:
      - name: Check out publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve TDLib build target
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$BUILD_TARGET" != 'latest-release' && "$BUILD_TARGET" != 'latest-commit' ]]; then
            echo "Unknown build target: $BUILD_TARGET" >&2
            exit 1
          fi

          git clone --filter=blob:none --no-checkout --single-branch \
            --branch master https://github.com/tdlib/td.git td

          if [[ "$BUILD_TARGET" == 'latest-commit' ]]; then
            sha=$(git -C td log origin/master -1 --format='%H')
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]

            git -C td checkout --detach "$sha"
            declared=$(sed -nE \
              's/^project\(TDLib VERSION ([0-9]+\.[0-9]+\.[0-9]+) .*/\1/p' \
              td/CMakeLists.txt)
            [[ "$declared" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

            version="$declared-${sha:0:12}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{12}$ ]]
            echo "Building latest TDLib master commit $sha as $version."
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            record=$(git -C td log origin/master -1 --extended-regexp \
              --grep='^Update version to [0-9]+\.[0-9]+\.[0-9]+\.?$' \
              --format='%H%x09%s')
            if [[ -z "$record" ]]; then
              echo 'Unable to find the latest TDLib version commit.' >&2
              exit 1
            fi

            IFS=$'\t' read -r sha subject <<< "$record"
            version=${subject#Update version to }
            version=${version%.}

            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

            git -C td checkout --detach "$sha"
            declared=$(sed -nE \
              's/^project\(TDLib VERSION ([0-9]+\.[0-9]+\.[0-9]+) .*/\1/p' \
              td/CMakeLists.txt)
            if [[ "$declared" != "$version" ]]; then
              echo "TDLib version mismatch: commit says $version, CMake says $declared" >&2
              exit 1
            fi
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if git show-ref --verify --quiet "refs/tags/v$version"; then
            echo "TDLib $version is already published."
            echo 'should_build=false' >> "$GITHUB_OUTPUT"
          else
            echo "TDLib $version needs to be built."
            echo 'should_build=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate and apply downstream patches
        if: steps.upstream.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout \
            "https://github.com/$PATCHES_REPOSITORY.git" downstream-patches
          git -C downstream-patches checkout --detach "$PATCHES_REF"
          ./downstream-patches/tdlib/apply.sh td

      - name: Set up JDK 17
        if: steps.upstream.outputs.should_build == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build tools
        if: steps.upstream.outputs.should_build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential gperf make ninja-build perl php-cli sed tar unzip

      - name: Cache Android SDK and NDK
        if: steps.upstream.outputs.should_build == 'true'
        id: sdk-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/libtd-cache/SDK
          key: android-sdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('td/example/android/fetch-sdk.sh') }}

      - name: Fetch Android SDK and NDK
        if: steps.upstream.outputs.should_build == 'true' && steps.sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sdk=$RUNNER_TEMP/libtd-cache/SDK
          rm -rf "$sdk"
          cd td/example/android
          ./fetch-sdk.sh "$sdk" "$ANDROID_NDK_VERSION"

      - name: Cache OpenSSL
        if: steps.upstream.outputs.should_build == 'true'
        id: openssl-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/libtd-cache/openssl
          key: openssl-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.ANDROID_NDK_VERSION }}-${{ env.OPENSSL_VERSION }}-${{ env.PATCHES_REF }}-${{ hashFiles('td/example/android/build-openssl.sh') }}

      - name: Build OpenSSL
        if: steps.upstream.outputs.should_build == 'true' && steps.openssl-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          openssl=$RUNNER_TEMP/libtd-cache/openssl
          rm -rf "$openssl"
          cd td/example/android
          ./build-openssl.sh \
            "$RUNNER_TEMP/libtd-cache/SDK" \
            "$ANDROID_NDK_VERSION" \
            "$openssl" \
            "$OPENSSL_VERSION"

      - name: Build TDLib
        if: steps.upstream.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd td/example/android
          ./build-tdlib.sh \
            "$RUNNER_TEMP/libtd-cache/SDK" \
            "$ANDROID_NDK_VERSION" \
            "$RUNNER_TEMP/libtd-cache/openssl" \
            c++_static \
            Java

      - name: Verify ELF files and report sizes
        if: steps.upstream.outputs.should_build == 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail

          libs=td/example/android/tdlib/libs
          ndk_bin=$RUNNER_TEMP/libtd-cache/SDK/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin
          readelf=$ndk_bin/llvm-readelf
          nm=$ndk_bin/llvm-nm
          ninja=$RUNNER_TEMP/libtd-cache/SDK/cmake/3.22.1/bin/ninja
          abis=()
          for dir in "$libs"/*/; do
            [[ -d "$dir" ]] || continue
            abis+=("$(basename "$dir")")
          done
          if ((${#abis[@]} == 0)); then
            echo 'No TDLib ABI outputs found.' >&2
            exit 1
          fi

          for abi in "${abis[@]}"; do
            if [[ ! -d "td/example/android/build-$abi-Java" ]]; then
              echo "Missing build directory for ABI $abi." >&2
              exit 1
            fi
          done

          build_dir=td/example/android/build-${abis[0]}-Java
          grep -Eq "^ANDROID_PLATFORM(:[^=]+)?=$ANDROID_PLATFORM$" \
            "$build_dir/CMakeCache.txt"
          sqlite_commands=$("$ninja" -C "$build_dir" -t commands tdsqlite)
          grep -F 'sqlite3.c' <<< "$sqlite_commands" \
            | grep -F -- '-flto=thin' \
            | grep -Fq -- '-Oz'

          {
            echo "## libtd $VERSION"
            echo
            echo "Upstream: https://github.com/tdlib/td/commit/$UPSTREAM_SHA"
            echo
            echo '| ABI | Bytes | MiB | Previous bytes | Delta bytes | Relocations | LOAD alignment |'
            echo '|---|---:|---:|---:|---:|---|---|'
          } > size-report.md

          for abi in "${abis[@]}"; do
            so=$libs/$abi/libtdjni.so
            [[ -s "$so" ]]

            dynamic=$("$readelf" -dW "$so")
            sections=$("$readelf" -SW "$so")
            grep -Eq '\(ANDROID_RELA?\)' <<< "$dynamic"
            grep -Eq '[[:space:]]ANDROID_RELA?[[:space:]]' <<< "$sections"
            if grep -Fq '.symtab' <<< "$sections"; then
              echo "$so still contains a static symbol table." >&2
              exit 1
            fi
            "$nm" -D --defined-only "$so" | grep -Eq '[[:space:]]JNI_OnLoad$'

            alignment='n/a (32-bit)'
            if "$readelf" -hW "$so" | grep -Eq 'Class:[[:space:]]+ELF64'; then
              headers=$("$readelf" -lW "$so")
              mapfile -t load_alignments < <(awk '$1 == "LOAD" {print $NF}' <<< "$headers")
              if ((${#load_alignments[@]} == 0)); then
                echo "$so has no LOAD segments." >&2
                exit 1
              fi
              for value in "${load_alignments[@]}"; do
                [[ "$value" =~ ^0x[0-9a-fA-F]+$ ]]
                if ((value < 0x4000)); then
                  echo "$so has a LOAD segment below 16 KiB alignment: $value" >&2
                  exit 1
                fi
              done
              alignment=$(IFS=,; echo "${load_alignments[*]}")
            fi

            bytes=$(stat -c '%s' "$so")
            mib=$(awk -v bytes="$bytes" 'BEGIN {printf "%.2f", bytes / 1048576}')
            previous=src/main/libs/$abi/libtdjni.so
            previous_bytes=0
            if [[ -f "$previous" ]]; then
              previous_bytes=$(stat -c '%s' "$previous")
            fi
            delta=$((bytes - previous_bytes))

            printf '| `%s` | %s | %s | %s | %+d | APS2 | `%s` |\n' \
              "$abi" "$bytes" "$mib" "$previous_bytes" "$delta" "$alignment" \
              >> size-report.md
          done

          cat size-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Package generated outputs
        if: steps.upstream.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf generated libtd-generated.tar.gz
          mkdir -p generated/src/main
          cp -a td/example/android/tdlib/java generated/src/main/java
          cp -a td/example/android/tdlib/libs generated/src/main/libs
          if find generated -type l -print -quit | grep -q .; then
            echo 'Generated output contains a symbolic link.' >&2
            exit 1
          fi
          tar -C generated -czf libtd-generated.tar.gz src

      - name: Upload generated outputs
        if: steps.upstream.outputs.should_build == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: libtd-${{ steps.upstream.outputs.version }}
          path: |
            libtd-generated.tar.gz
            size-report.md
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: needs.build.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download generated outputs
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: libtd-${{ needs.build.outputs.version }}
          path: artifact

      - name: Replace generated sources and libraries
        shell: bash
        run: |
          set -euo pipefail
          archive=artifact/libtd-generated.tar.gz
          [[ -s "$archive" ]]
          listing=$(tar -tzf "$archive")
          if grep -Eq '(^/|(^|/)\.\.(/|$))' <<< "$listing"; then
            echo 'Generated archive contains an unsafe path.' >&2
            exit 1
          fi

          rm -rf extracted
          mkdir extracted
          tar -xzf "$archive" -C extracted --no-same-owner
          if find extracted -type l -print -quit | grep -q .; then
            echo 'Generated archive contains a symbolic link.' >&2
            exit 1
          fi
          [[ -f extracted/src/main/java/org/drinkless/tdlib/Client.java ]]
          [[ -f extracted/src/main/java/org/drinkless/tdlib/TdApi.java ]]
          shopt -s nullglob
          jni_libs=(extracted/src/main/libs/*/libtdjni.so)
          if ((${#jni_libs[@]} == 0)); then
            echo 'Generated archive contains no libtdjni.so.' >&2
            exit 1
          fi
          for so in "${jni_libs[@]}"; do
            [[ -s "$so" ]]
          done

          rm -rf src/main/java src/main/libs
          mkdir -p src/main
          cp -a extracted/src/main/java src/main/java
          cp -a extracted/src/main/libs src/main/libs

      - name: Commit, tag, and push atomically
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ needs.build.outputs.version }}
          UPSTREAM_SHA: ${{ needs.build.outputs.sha }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- src/main/java src/main/libs
          git diff --cached --check
          git fetch origin "$TARGET_BRANCH" --tags

          upstream_url="https://github.com/tdlib/td/commit/$UPSTREAM_SHA"
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            echo "Tag v$VERSION already exists." >&2
            exit 1
          fi

          if git diff --cached --quiet; then
            echo 'Build produced no generated changes; publishing the tag only.'
            git tag -a "v$VERSION" -m "libtd v$VERSION" -m "Upstream: $upstream_url"
            gh auth setup-git
            git push --atomic origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
            exit 0
          fi

          if [[ "$PRERELEASE" == 'true' ]]; then
            git commit \
              -m "chore(libtd): snapshot TDLib $VERSION" \
              -m "Upstream: $upstream_url"
          else
            git commit \
              -m "chore(libtd): update TDLib to $VERSION" \
              -m "Upstream: $upstream_url"
          fi

          base=$(git rev-parse HEAD^)
          remote=$(git rev-parse "origin/$TARGET_BRANCH")
          if [[ "$base" != "$remote" ]]; then
            echo 'The publisher branch moved during the build; rerun the workflow.' >&2
            exit 1
          fi

          git tag -a "v$VERSION" -m "libtd v$VERSION" -m "Upstream: $upstream_url"
          gh auth setup-git
          git push --atomic origin \
            "HEAD:refs/heads/$TARGET_BRANCH" \
            "refs/tags/v$VERSION:refs/tags/v$VERSION"

  release:
    needs: [build, publish]
    if: >-
      always() &&
      needs.build.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download size report
        if: needs.build.outputs.should_build == 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: libtd-${{ needs.build.outputs.version }}
          path: artifact

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          tag=v$VERSION
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi

          if [[ -f artifact/size-report.md ]]; then
            notes_file=artifact/size-report.md
          else
            notes_file=release-notes.md
            printf 'Automated libtd %s build.\n' "$VERSION" > "$notes_file"
          fi

          args=(--verify-tag --title "libtd v$VERSION" --notes-file "$notes_file")
          if [[ "$PRERELEASE" == 'true' ]]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$tag" "${args[@]}"
